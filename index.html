<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Conclave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-bg: #0a0a0a;
            --input-bg: #111111;
            --text-primary: #ffffff;
            --text-secondary: #8b8b8b;
            --border-color: #2a2a2a;
            --user-bubble: #262626;
            --ai-bubble: #0a0a0a;
            --btn-bg: rgba(255, 255, 255, 0.85);
            --btn-text: #000000;
            --mention-color: #2d9cf4;
            --error-text: #ff4d4d;
            --success-text: #28a745;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        #sidebar { width: 280px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); flex-shrink: 0; }
        .sidebar-header { padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h2 { font-size: 17px; font-weight: 700; }
        
        /* Sidebar Tabs */
        .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .sidebar-tab { flex: 1; padding: 12px 0; background: transparent; border: none; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .sidebar-tab:hover { color: var(--text-primary); }
        .sidebar-tab.active { color: #fff; border-bottom: 2px solid #fff; }
        
        .sidebar-content { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
        .sidebar-content.active { display: flex; }

        /* Chats Tab */
        .new-chat-btn { margin: 15px; padding: 10px; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        #chat-list { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 4px; }
        .chat-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
        .chat-item:hover { background: #1a1a1a; color: var(--text-primary); }
        .chat-item.active { background: #1c1c1c; color: var(--text-primary); }
        .chat-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .chat-actions { display: none; gap: 5px; }
        .chat-item:hover .chat-actions { display: flex; }
        .logout-btn { margin: 15px; padding: 8px; background: transparent; color: var(--error-text); border: 1px solid var(--error-text); border-radius: 8px; cursor: pointer; font-size: 13px; }

        /* Models Tab */
        .models-toolbar { padding: 15px 10px 5px; }
        .model-search { width: 100%; background: #000; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .model-count { padding: 5px 10px; font-size: 11px; color: var(--text-secondary); }
        #models-list { padding: 5px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
        .model-item { padding: 8px 10px; border-radius: 8px; background: #0a0a0a; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .model-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; color: var(--text-primary); }
        .model-item button { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; margin-left: 5px; }
        .model-item button:hover { border-color: #fff; color: #fff; }
        .model-item button.blacklisted { color: var(--error-text); border-color: var(--error-text); }
        .models-note { padding: 10px; font-size: 11px; color: var(--text-secondary); }

        /* Settings Tab */
        .settings-section { padding: 15px 15px 5px; }
        .settings-section h4 { font-size: 12px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 10px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 5px; background: #0a0a0a; border: 1px solid var(--border-color); }
        .setting-row .value { color: var(--text-secondary); }
        .danger-btn { width: 100%; margin-top: 5px; padding: 10px; background: transparent; color: var(--error-text); border: 1px solid var(--error-text); border-radius: 8px; cursor: pointer; font-size: 13px; }
        .danger-btn:hover { background: var(--error-text); color: #fff; }
        .version-info { padding: 20px; text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: auto; }

        /* --- MAIN AREA --- */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); min-width: 0; }
        #auth-container { flex: 1; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--sidebar-bg); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border-color); }
        .auth-input { background: #000; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .auth-btn { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .auth-btn.secondary { background: transparent; color: #fff; border: 1px solid var(--border-color); }

        #app-container { display: none; flex-direction: column; flex: 1; height: 100%; }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .branch-btn { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }

        #models-bar { padding: 10px 20px; background: #0a0a0a; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .model-dropdown { background: #000; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 13px; max-width: 250px; }
        .nickname-input { background: #000; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 13px; width: 110px; outline: none; }
        .add-model-btn { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .active-models-container { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
        .model-chip { background: #000; border: 1px solid #333; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .model-chip .remove { cursor: pointer; opacity: 0.6; }

        #chat-box { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.6; overflow-wrap: break-word; }
        .user-message { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background: var(--ai-bubble); border: 1px solid #2a2a2a; border-bottom-left-radius: 2px; }
        .system-message { align-self: center; border: 1px dashed #444; font-size: 12px; padding: 8px 16px; border-radius: 20px; }
        .system-message.error { color: var(--error-text); border-color: var(--error-text); }
        .system-message.success { color: var(--success-text); border-color: var(--success-text); }
        .ai-name { font-size: 12px; font-weight: 700; margin-bottom: 8px; opacity: 0.7; }
        .ai-message pre { background: #000; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid #2a2a2a; }
        .ai-message code { font-family: 'Courier New', monospace; font-size: 13px; }
        .mention { color: var(--mention-color); font-weight: 500; }

        #input-area { padding: 20px; border-top: 1px solid var(--border-color); display: flex; gap: 15px; align-items: flex-end; }
        #user-input { flex: 1; background: #111; border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; color: #fff; font-size: 14px; outline: none; resize: none; max-height: 150px; }
        #send-btn { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 0 20px; height: 50px; border-radius: 12px; font-weight: 700; cursor: pointer; min-width: 100px; }
        #send-btn:disabled { opacity: 0.4; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        .loader { border: 2px solid #000; border-top: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <svg viewBox="0 0 100 100" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#ffffff" stroke-width="2"><line x1="50" y1="20" x2="50" y2="50"/><line x1="78.5" y1="40.7" x2="50" y2="50"/><line x1="67.6" y1="74.3" x2="50" y2="50"/><line x1="32.4" y1="74.3" x2="50" y2="50"/><line x1="21.5" y1="40.7" x2="50" y2="50"/></g>
            <circle cx="50" cy="20" r="8" fill="#ffffff"/><circle cx="78.5" cy="40.7" r="8" fill="#ffffff"/><circle cx="67.6" cy="74.3" r="8" fill="#ffffff"/><circle cx="32.4" cy="74.3" r="8" fill="#ffffff"/><circle cx="21.5" cy="40.7" r="8" fill="#ffffff"/><circle cx="50" cy="50" r="12" fill="#2ee6a8"/>
        </svg>
        <h2>The Conclave</h2>
    </div>
    
    <div class="sidebar-tabs">
        <button class="sidebar-tab active" onclick="switchTab('chats')">Chats</button>
        <button class="sidebar-tab" onclick="switchTab('models')">Models</button>
        <button class="sidebar-tab" onclick="switchTab('settings')">Settings</button>
    </div>

    <!-- CHATS TAB -->
    <div class="sidebar-content active" id="tab-chats">
        <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
        <div id="chat-list"></div>
        <button class="logout-btn" onclick="logout()" id="logout-btn" style="display:none;">Logout</button>
    </div>

    <!-- MODELS TAB -->
    <div class="sidebar-content" id="tab-models">
        <div class="models-toolbar">
            <input type="text" class="model-search" id="models-tab-search" placeholder="Search models..." oninput="renderModelsList()">
        </div>
        <div class="model-count" id="model-count"></div>
        <div id="models-list"></div>
        <div class="models-note">Blacklisted models are hidden everywhere on this device. Add models from the dropdown in the chat header.</div>
    </div>

    <!-- SETTINGS TAB -->
    <div class="sidebar-content" id="tab-settings">
        <div class="settings-section">
            <h4>Account</h4>
            <div class="setting-row"><span>Logged in as</span><span class="value" id="settings-username">-</span></div>
        </div>
        <div class="settings-section">
            <h4>Models</h4>
            <button class="danger-btn" onclick="resetFailedModels()">Unblock failed models</button>
        </div>
        <div class="settings-section">
            <h4>Danger Zone</h4>
            <button class="danger-btn" onclick="clearAllData()">Clear ALL data (chats, accounts)</button>
        </div>
        <div class="version-info">The Conclave v1.0<br>Made by Izarot ⚡</div>
    </div>
</div>

<div id="chat-area">
    <div id="auth-container">
        <div class="auth-card">
            <h2>Welcome to The Conclave</h2>
            <input type="text" class="auth-input" id="username" placeholder="Username">
            <input type="password" class="auth-input" id="password" placeholder="Password">
            <button class="auth-btn" onclick="login()">Login</button>
            <button class="auth-btn secondary" onclick="register()">Create Account</button>
        </div>
    </div>

    <div id="app-container">
        <div class="chat-header">
            <h3 id="current-chat-title">New Chat</h3>
            <button class="branch-btn" onclick="branchChat()">Branch</button>
        </div>
        <div id="models-bar">
            <select class="model-dropdown" id="model-select"><option value="">Loading models...</option></select>
            <input type="text" class="nickname-input" id="nickname-input" placeholder="Nickname">
            <button class="add-model-btn" onclick="addModel()">+ Add</button>
            <div class="active-models-container" id="active-models"></div>
        </div>
        <div id="chat-box"></div>
        <div id="input-area">
            <textarea id="user-input" placeholder="Send a message... @nickname targets a model." rows="1" oninput="autoResize(this)"></textarea>
            <button id="send-btn" onclick="sendMessage()"><span id="send-text">Send</span><div id="send-loader" class="loader" style="display:none;"></div></button>
        </div>
    </div>
</div>

<script>
    let currentUser = null, activeModels = [], history = [], currentChatId = null, isSending = false;
    let allAvailableModels = [];
    let failedModels = JSON.parse(localStorage.getItem('conclave_failed_models') || '[]');
    let blacklistedModels = JSON.parse(localStorage.getItem('conclave_blacklisted_models') || '[]');

    const getUsers = () => JSON.parse(localStorage.getItem('conclave_users') || '[]');
    const saveUsers = u => localStorage.setItem('conclave_users', JSON.stringify(u));

    function switchTab(tab) {
        document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.sidebar-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.sidebar-tab[onclick="switchTab('${tab}')"]`).classList.add('active');
        document.getElementById(`tab-${tab}`).classList.add('active');
        if (tab === 'models') renderModelsList();
        if (tab === 'settings') document.getElementById('settings-username').innerText = currentUser || '-';
    }

    function register() {
        const u = username.value, p = password.value;
        if (!u || !p) return alert("Enter user and pass");
        let users = getUsers();
        if (users.find(x => x.username === u)) return alert("User exists");
        users.push({ username: u, password: p, chats: [] });
        saveUsers(users); login();
    }

    function login() {
        const u = username.value, p = password.value;
        let user = getUsers().find(x => x.username === u && x.password === p);
        if (!user) return alert("Invalid credentials");
        currentUser = user.username;
        authContainer.style.display = 'none';
        appContainer.style.display = 'flex';
        logoutBtn.style.display = 'block';
        renderChatList(user.chats);
        loadModels();
    }

    function logout() { currentUser = null; location.reload(); }

    function newChat() {
        currentChatId = 'chat_' + Date.now(); history = []; activeModels = [];
        chatBox.innerHTML = ''; currentChatTitle.innerText = 'New Chat';
        renderActiveModels();
        renderChatList(getUsers().find(u => u.username === currentUser)?.chats || []);
    }

    function saveChat() {
        if (!currentUser || !currentChatId) return;
        let users = getUsers(), user = users.find(x => x.username === currentUser);
        if (!user) return;
        let idx = user.chats.findIndex(c => c.id === currentChatId);
        let data = { id: currentChatId, name: currentChatTitle.innerText, history, models: activeModels };
        if (idx >= 0) user.chats[idx] = data; else user.chats.push(data);
        saveUsers(users); renderChatList(user.chats);
    }

    function renderChatList(chats) {
        const list = document.getElementById('chat-list'); list.innerHTML = '';
        chats.forEach(c => {
            const div = document.createElement('div');
            div.className = `chat-item ${c.id === currentChatId ? 'active' : ''}`;
            div.innerHTML = `<span onclick="loadChat('${c.id}')">${c.name}</span><div class="chat-actions"><button class="chat-action-btn" onclick="renameChat('${c.id}')">✏️</button><button class="chat-action-btn" onclick="deleteChat('${c.id}')">🗑️</button></div>`;
            list.appendChild(div);
        });
    }

    function loadChat(id) {
        let user = getUsers().find(u => u.username === currentUser);
        let chat = user.chats.find(c => c.id === id); if (!chat) return;
        currentChatId = chat.id; history = chat.history; activeModels = chat.models;
        chatBox.innerHTML = ''; currentChatTitle.innerText = chat.name;
        renderActiveModels();
        history.forEach(msg => {
            if (msg.role === 'user') addMessage('user', msg.content);
            else msg.content.split('\n\n').forEach(p => { const m = p.match(/\[(.*?)\]: (.*)/s); if (m) addMessage('ai', m[2], m[1]); });
        });
        renderChatList(user.chats);
    }

    function renameChat(id) {
        let user = getUsers().find(u => u.username === currentUser);
        let chat = user.chats.find(c => c.id === id);
        let newName = prompt("New name:", chat.name);
        if (newName) { chat.name = newName; saveUsers(user); renderChatList(user.chats); if (id === currentChatId) currentChatTitle.innerText = newName; }
    }

    function deleteChat(id) {
        if (!confirm("Delete this chat?")) return;
        let users = getUsers(), user = users.find(u => u.username === currentUser);
        user.chats = user.chats.filter(c => c.id !== id);
        saveUsers(users);
        if (id === currentChatId) newChat();
        renderChatList(user.chats);
    }

    function branchChat() {
        if (!currentChatId) return;
        let user = getUsers().find(u => u.username === currentUser);
        let chat = user.chats.find(c => c.id === currentChatId);
        currentChatId = 'chat_' + Date.now();
        history = [...chat.history]; activeModels = [...chat.models];
        currentChatTitle.innerText = "Branch: " + chat.name;
        saveChat();
    }

    // --- MODELS ---
    async function loadModels() {
        try {
            const res = await fetch('/api/models');
            allAvailableModels = await res.json();
            const select = document.getElementById('model-select');
            select.innerHTML = '';
            allAvailableModels.filter(m => !blacklistedModels.includes(m.id) && !failedModels.includes(m.id)).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id; opt.innerText = m.name;
                select.appendChild(opt);
            });
            renderModelsList();
        } catch (e) {
