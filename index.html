<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conclave AI</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; display: flex; justify-content: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; border-left: 1px solid #333; border-right: 1px solid #333; }
        #header { padding: 20px; background: #1a1a2e; text-align: center; border-bottom: 1px solid #00ffcc; box-shadow: 0 0 10px #00ffcc; }
        #header h1 { margin: 0; color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .user { align-self: flex-end; background: #00ffcc; color: #000; border-bottom-right-radius: 0; }
        .ai { align-self: flex-start; background: #1a1a2e; border: 1px solid #444; border-bottom-left-radius: 0; }
        .analyst { border-color: #4488ff; color: #4488ff; }
        .creative { border-color: #ff00aa; color: #ff00aa; }
        .critic { border-color: #ff3333; color: #ff3333; }
        .name { font-size: 0.8em; font-weight: bold; margin-bottom: 4px; display: block; }
        #input-area { display: flex; padding: 20px; background: #1a1a2e; border-top: 1px solid #333; }
        #user-input { flex: 1; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #0f0f1a; color: #fff; font-size: 16px; outline: none; }
        #send-btn { background: #00ffcc; color: #000; border: none; padding: 0 20px; margin-left: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #send-btn:hover { box-shadow: 0 0 15px #00ffcc; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <h1>🏛️ Conclave</h1>
        <p style="margin: 5px 0 0; font-size: 0.8em; color: #888;">Use @Analyst, @Creative, or @Critic</p>
    </div>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Send a message to the council..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>
</div>

<script>
    let history = [];
    const chatBox = document.getElementById('chat-box');

    function addMessage(sender, text, className = '') {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${sender} ${className}`;
        
        if (sender === 'ai') {
            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.innerText = className.charAt(0).toUpperCase() + className.slice(1);
            msgDiv.appendChild(nameSpan);
        }
        
        const textSpan = document.createElement('span');
        textSpan.innerText = text;
        msgDiv.appendChild(textSpan);
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        input.value = '';

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history: history })
            });
            const data = await res.json();

            if (data.responses) {
                data.responses.forEach(r => {
                    const cls = r.name.toLowerCase();
                    addMessage('ai', r.text, cls);
                });
                history = data.history; // Update shared history
            } else {
                addMessage('user', 'Error: ' + data.error, 'critic');
            }
        } catch (e) {
            addMessage('user', 'Network Error.', 'critic');
        }
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('user-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
