<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Conclave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="app.js"></script>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <svg viewBox="0 0 100 100" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#ffffff" stroke-width="2"><line x1="50" y1="20" x2="50" y2="50"/><line x1="78.5" y1="40.7" x2="50" y2="50"/><line x1="67.6" y1="74.3" x2="50" y2="50"/><line x1="32.4" y1="74.3" x2="50" y2="50"/><line x1="21.5" y1="40.7" x2="50" y2="50"/></g>
            <circle cx="50" cy="20" r="8" fill="#ffffff"/><circle cx="78.5" cy="40.7" r="8" fill="#ffffff"/><circle cx="67.6" cy="74.3" r="8" fill="#ffffff"/><circle cx="32.4" cy="74.3" r="8" fill="#ffffff"/><circle cx="21.5" cy="40.7" r="8" fill="#ffffff"/><circle cx="50" cy="50" r="12" fill="#2ee6a8"/>
        </svg>
        <h2>The Conclave</h2>
    </div>

    <div class="sidebar-tabs">
        <button class="sidebar-tab active" onclick="switchTab('chats')">Chats</button>
        <button class="sidebar-tab" onclick="switchTab('models')">Models</button>
        <button class="sidebar-tab" onclick="switchTab('settings')">Settings</button>
    </div>

    <div class="sidebar-content active" id="tab-chats">
        <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
        <div id="chat-list"></div>
        <button class="logout-btn" onclick="logout()" id="logout-btn" style="display:none;">Logout</button>
    </div>

    <div class="sidebar-content" id="tab-models">
        <div class="models-toolbar">
            <input type="text" class="model-search" id="models-tab-search" placeholder="Search models..." oninput="renderModelsList()">
        </div>
        <div class="model-count" id="model-count"></div>
        <div id="models-list"></div>
        <div class="models-note">Blacklisted models are hidden everywhere on this device. Add models from the dropdown in the chat header.</div>
    </div>

    <div class="sidebar-content" id="tab-settings">
        <div class="settings-section">
            <h4>Account</h4>
            <div class="setting-row"><span>Logged in as</span><span class="value" id="settings-username">-</span></div>
        </div>
        <div class="settings-section">
            <h4>Models</h4>
            <button class="danger-btn" onclick="resetFailedModels()">Unblock failed models</button>
        </div>
        <div class="settings-section">
            <h4>Danger Zone</h4>
            <button class="danger-btn" onclick="clearAllData()">Clear ALL data (chats, accounts)</button>
        </div>
        <div class="version-info">The Conclave v1.0<br>Made by Izarot ⚡</div>
    </div>
</div>

<div id="chat-area">
    <div id="auth-container">
        <div class="auth-card">
            <h2>Welcome to The Conclave</h2>
            <input type="text" class="auth-input" id="username" placeholder="Username">
            <input type="password" class="auth-input" id="password" placeholder="Password">
            <button class="auth-btn" onclick="login()">Login</button>
            <button class="auth-btn secondary" onclick="register()">Create Account</button>
        </div>
    </div>

    <div id="app-container">
        <div class="chat-header">
            <h3 id="current-chat-title">New Chat</h3>
            <button class="branch-btn" onclick="branchChat()">Branch</button>
        </div>
        <div id="models-bar">
            <select class="model-dropdown" id="model-select"><option value="">Loading models...</option></select>
            <input type="text" class="nickname-input" id="nickname-input" placeholder="Nickname">
            <button class="add-model-btn" onclick="addModel()">+ Add</button>
            <div class="active-models-container" id="active-models"></div>
        </div>
        <div id="chat-box"></div>
        <div id="input-area">
            <textarea id="user-input" placeholder="Send a message... @nickname targets a model." rows="1" oninput="autoResize(this)"></textarea>
            <button id="send-btn" onclick="sendMessage()"><span id="send-text">Send</span><div id="send-loader" class="loader" style="display:none;"></div></button>
        </div>
    </div>
</div>

</body>
</html>
